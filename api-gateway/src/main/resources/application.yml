server: {port: 8080, shutdown: graceful}
spring:
  application: {name: api-gateway}
  cloud.gateway.routes:
    - {id: auth, uri: "http://auth-service:8081", predicates: ["Path=/api/auth/**"]}
    - {id: products, uri: "http://product-service:8082", predicates: ["Path=/api/products/**"]}
    - {id: carts, uri: "http://cart-service:8083", predicates: ["Path=/api/carts/**"]}
    - {id: orders, uri: "http://order-service:8084", predicates: ["Path=/api/orders/**"]}
    - {id: inventory, uri: "http://inventory-service:8085", predicates: ["Path=/api/inventory/**"]}
management.endpoints.web.exposure.include: health,info,gateway
jwt.secret: "${JWT_SECRET:development-only-secret-change-me-123456}"
