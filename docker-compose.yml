name: orderflow
x-service: &service
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O - http://localhost:$${SERVER_PORT}/actuator/health | grep -q UP"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 30s
  environment: &common
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-orderflow}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_DATA_REDIS_HOST: redis
    JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-123456}
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: orderflow, POSTGRES_USER: "${POSTGRES_USER:-orderflow}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-orderflow}"}
    volumes: [postgres-data:/var/lib/postgresql/data, ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 10}
  auth-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: auth-service}}
    environment: {<<: *common, SERVER_PORT: 8081}
    ports: ["127.0.0.1:8081:8081"]
  product-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: product-service}}
    environment: {<<: *common, SERVER_PORT: 8082}
    ports: ["127.0.0.1:8082:8082"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  cart-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: cart-service}}
    environment: {<<: *common, SERVER_PORT: 8083}
    ports: ["127.0.0.1:8083:8083"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  order-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: order-service}}
    environment: {<<: *common, SERVER_PORT: 8084}
    ports: ["127.0.0.1:8084:8084"]
  inventory-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: inventory-service}}
    environment: {<<: *common, SERVER_PORT: 8085}
    ports: ["127.0.0.1:8085:8085"]
  payment-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: payment-service}}
    ports: ["127.0.0.1:8086:8086"]
    environment: {<<: *common, SERVER_PORT: 8086, PAYMENT_FAILURE_RATE: "${PAYMENT_FAILURE_RATE:-0.10}"}
  api-gateway:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: api-gateway}}
    environment: {JWT_SECRET: "${JWT_SECRET:-development-only-secret-change-me-123456}", SERVER_PORT: 8080}
    ports: ["8080:8080"]
    depends_on:
      auth-service: {condition: service_healthy}
      product-service: {condition: service_healthy}
      cart-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api-gateway]
volumes: {postgres-data: {}}
