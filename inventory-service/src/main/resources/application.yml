server: {port: 8085, shutdown: graceful}
spring: {application: {name: inventory-service}, datasource: {url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderflow}", username: "${SPRING_DATASOURCE_USERNAME:orderflow}", password: "${SPRING_DATASOURCE_PASSWORD:orderflow}"}, jpa: {hibernate: {ddl-auto: validate}, properties: {hibernate: {default_schema: inventory}}}, flyway: {schemas: inventory, default-schema: inventory}, rabbitmq: {host: "${SPRING_RABBITMQ_HOST:localhost}", listener.simple: {acknowledge-mode: auto, default-requeue-rejected: false, retry: {enabled: true, max-attempts: 3}}}}
management.endpoints.web.exposure.include: health,info
