server: {port: 8082, shutdown: graceful}
spring:
  application: {name: product-service}
  datasource: {url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/orderflow}", username: "${SPRING_DATASOURCE_USERNAME:orderflow}", password: "${SPRING_DATASOURCE_PASSWORD:orderflow}"}
  jpa: {hibernate: {ddl-auto: validate}, properties: {hibernate: {default_schema: product}}}
  flyway: {schemas: product, default-schema: product}
  data.redis: {host: "${SPRING_DATA_REDIS_HOST:localhost}", port: 6379}
  cache.redis.time-to-live: 300000
management.endpoints.web.exposure.include: health,info
